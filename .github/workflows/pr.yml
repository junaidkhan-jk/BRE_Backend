name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, conformance and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Every action is pinned to a commit SHA, not a tag. A tag is a mutable
      # pointer: whoever controls the action's repository can move v4 to new
      # code, and that code runs with this workflow's token against a credit
      # platform's source. The version is in the comment so the pin is still
      # readable; Dependabot updates both together.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Two JDKs on purpose: the Gradle daemon runs on 21 because
      # google-java-format cannot run on 25 yet, while the build compiles every
      # module to the Java 25 toolchain (ADR-012). See CONTRIBUTING.md.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          build-root-directory: backend

      # Runs Spotless, Error Prone (findings are errors), ArchUnit, every unit
      # test, the 90 conformance vectors, and the fail-closed property at 10^6
      # cases. About two minutes, most of it the property.
      - name: Build, format, ArchUnit, unit and conformance tests
        run: ./gradlew build --stacktrace
        working-directory: backend

      - name: D11 / ADR-016 repository boundary
        run: ./gradlew checkLibsAreMavenCentralOnly --stacktrace
        working-directory: backend

      # The summary line is not evidence. A Jupiter @Tag on a jqwik property
      # once made the platform filter skip it while the build stayed green, and
      # a grep in a pipeline once swallowed a failing build's exit status — both
      # in this repository. So the run asserts on the XML: no failures, no
      # errors, and nothing silently skipped.
      - name: Assert no test was skipped
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          files = [f for f in glob.glob("backend/**/build/test-results/test/*.xml", recursive=True)
                   if "Fuzz" not in f]
          if not files:
              sys.exit("no test-results XML found: the test task did not run")
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests"))
              failed += int(root.get("failures")) + int(root.get("errors"))
              skipped += int(root.get("skipped"))
          print(f"{total} tests, {failed} failed, {skipped} skipped")
          if failed:
              sys.exit(f"{failed} test(s) failed")
          if skipped:
              sys.exit(f"{skipped} test(s) skipped; a skipped test is not a passing test")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 7

  # M5-09. Runs against the PRODUCTION bundle, not the dev server: the one UI defect this project
  # shipped was a bundling defect, and a suite that only exercised the dev server would have been
  # green throughout.
  studio:
    name: Rule Studio end-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/studio-web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/studio-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Includes the axe audit, which fails on any WCAG 2.1 A or AA violation. An audit that only
      # reports is an audit nobody reads.
      - name: End-to-end and accessibility
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: ui/studio-web/playwright-report/
          retention-days: 7

  # What this gate does NOT yet cover, written to the run summary.
  #
  # This was four separate jobs that each echoed a sentence and exited 0. That
  # made a reviewer see four green checks named "Contracts", "SBOM" and "JMH
  # smoke" for work that does not exist — a check that reports success for
  # nothing built is worse than no check, because it is read as assurance. One
  # notice job instead: it states the gaps where a reviewer will see them,
  # without any of them looking like a passing gate.
  coverage-gaps:
    name: Gaps this gate does not cover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the gaps to the run summary
        run: |
          {
            echo "### Not covered by this PR gate"
            echo
            echo "| Build Plan task | What is missing |"
            echo "|---|---|"
            echo "| M1-16 | JMH benchmarks and latency budgets. No performance figure for this engine exists. |"
            echo "| M2-02 | The decision-log SQL has never been executed against a database. |"
            echo "| M2-03 | Contract checks (buf breaking, OpenAPI, AsyncAPI) — no contracts module yet. |"
            echo "| M2-04 | SBOM and licence scan — wired when services/* apply bre.spring-service. |"
            echo
            echo "See \`docs/html/status.html\` for the full task state."
          } >> "$GITHUB_STEP_SUMMARY"
