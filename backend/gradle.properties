# google-java-format drives javac's own parser, so the JVM running Spotless must
# export those internals. Without these, every spotlessJavaCheck fails with a
# bare InvocationTargetException that names no cause.
org.gradle.jvmargs=-Xmx2g \
    --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
    --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
    --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
    --add-exports jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
    --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
    --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
    --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# The build cache is OFF deliberately. This machine runs several Claude Code
# sessions against one shared GRADLE_USER_HOME (~/.gradle), and concurrent
# cache writes lose the journal-cache lock and fail an otherwise-green build
# with "Timeout waiting to lock journal cache". The build is fast enough
# without it. Turn it back on if the backend gets its own GRADLE_USER_HOME.
org.gradle.caching=false
org.gradle.parallel=true

# Nexus credentials for trustt-platform-lib are NOT kept here. This file is
# committed. Put trusttNexusUsername / trusttNexusPassword in
# ~/.gradle/gradle.properties, or export TRUSTT_NEXUS_USERNAME /
# TRUSTT_NEXUS_PASSWORD. See bre.spring-service.gradle.kts.
