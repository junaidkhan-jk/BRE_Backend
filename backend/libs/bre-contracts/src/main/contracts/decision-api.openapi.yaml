openapi: 3.1.0

info:
  title: BRE Decision API
  version: 0.1.0
  summary: Facts in, decision out.
  description: |
    The synchronous Decision API of the BRE Platform.

    **This document describes what is implemented today, not the full specification.** The target
    contract is LLD §6.2, and the differences are listed under "Deviations from LLD §6.2" below.
    Documenting the target as though it were built would make this file useless as an integration
    reference, which is the only thing it is for.

    ## The one idea that explains the whole API

    A decision is a **pure function of `(facts, policy, asOf)`** (decision D2). The engine never
    calls a bureau, a KYC provider, a screening service or a core banking system. The caller
    assembles a complete fact snapshot and sends it; the engine decides and returns.

    Three things follow from that, and they are the reasons the API looks as it does:

    - **Replay is exact.** The same facts and the same policy always give the same decision, so a
      decision from last March can be reproduced byte for byte. That is what makes
      `GET /v1/decisions/{id}` an audit record rather than a log line.
    - **Latency is predictable.** There is no outbound call on the hot path, so the evaluation time
      is a property of the policy and the data, not of someone else's uptime.
    - **Regulated data stays with the caller.** Bureau reports and KYC documents are never cached
      by the engine, because it never fetches them.

    ## Fail-closed

    Missing data never produces an approval (decision D9). A rule whose facts are absent reports
    `DATA_MISSING` and the decision becomes `REFER`; a rule that cannot be evaluated reports
    `ERROR` and the decision becomes `REFER`. Neither can reach `APPROVE`. If you are integrating
    and see a `REFER` you did not expect, the cause is almost always a fact the policy needed and
    the request did not carry.

    ## Durability

    In compact mode the decision, its idempotency key and its outbox event are written to
    PostgreSQL in **one transaction, before the response returns**. An acknowledged decision is
    therefore durable. If that write fails you get an error and no decision — deliberately, because
    a decision you acted on that the lender cannot produce on audit is worse than no decision.

    ## Deviations from LLD §6.2

    | What | Today | §6.2 |
    |---|---|---|
    | Policy | sent **inline** on the request | resolved from a signed, content-addressed bundle by hash; policy is never accepted from a caller |
    | Auth | none | OAuth2 client credentials, scope `decisions:evaluate` |
    | Idempotency | `requestId` in the body | `Idempotency-Key` header |
    | Explanation | not available | `GET /v1/decisions/{id}/explanation`, regenerated by replay |
    | Entity results | one result per rule | per-entity results, deviations with required approval level, customer reasons |
    | Facts | plaintext, not stored by default | envelope-encrypted, split by identifying field group |
    | Transport | REST only | REST **and** gRPC |

    Accepting an inline policy is the largest of these and is a **development-mode affordance**: in
    a real deployment the registry resolves and pins a signed bundle, and a caller cannot influence
    which policy decides its application.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Decisions
    description: Evaluate a policy and read a recorded decision.

paths:
  /v1/decisions:
    post:
      tags: [Decisions]
      operationId: decide
      summary: Evaluate a policy against a fact snapshot
      description: |
        Evaluates every rule in the policy and returns one decision.

        **Idempotent on `(tenantId, requestId)`.** Retrying with the same pair returns the
        original decision, with the same `decisionId` — not a second decision. Evaluation is
        deterministic, so a duplicate would be harmless in itself; returning the first one means a
        retrying caller sees one decision rather than two that disagree about nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            examples:
              withinCap:
                summary: Affordable — approves
                value:
                  tenantId: t_acme
                  requestId: REQ-2026-0001
                  asOf: '2026-10-01'
                  facts:
                    application:
                      applicationRef: APP-2026-000123
                    member:
                      income: '20000'
                      emi: '5000'
                      age: 34
                  policy:
                    rules:
                      - code: MFI_FOIR_CAP
                        check: member.emi / member.income <= 0.5
                        reasonCode: POL_FOIR_EXCEEDED
                      - code: MFI_MIN_AGE
                        check: member.age >= 18
                        reasonCode: POL_UNDERAGE
              missingFact:
                summary: A fact the policy needs is absent — refers, never approves
                value:
                  tenantId: t_acme
                  requestId: REQ-2026-0002
                  asOf: '2026-10-01'
                  facts:
                    member:
                      emi: '5000'
                  policy:
                    rules:
                      - code: MFI_FOIR_CAP
                        check: member.emi / member.income <= 0.5
                        reasonCode: POL_FOIR_EXCEEDED
              guardedDivision:
                summary: A guard that makes division safe
                description: |
                  `and` short-circuits, so the division is never evaluated when income is zero —
                  which is why this is the idiomatic way to write an affordability check.
                value:
                  tenantId: t_acme
                  requestId: REQ-2026-0003
                  facts:
                    member:
                      income: '0'
                      emi: '5000'
                  policy:
                    rules:
                      - code: MFI_FOIR_CAP
                        check: member.income > 0 and member.emi / member.income <= 0.5
                        reasonCode: POL_FOIR_EXCEEDED
      responses:
        '201':
          description: |
            Decided and recorded. The `Location` header points at the decision.

            A 201 is returned even when a rule errored: a runtime error is reported **on the
            result** (`status: ERROR`, with an `error` code), not as an HTTP failure, because the
            engine did produce a decision — `REFER` — and the caller needs it.
          headers:
            Location:
              description: Where to read the decision back
              schema:
                type: string
                examples: ['/v1/decisions/01a11b0b-df03-76a2-a30c-255a7934d513']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
              examples:
                approved:
                  value:
                    decisionId: 01a11b0b-df03-76a2-a30c-255a7934d513
                    tenantId: t_acme
                    requestId: REQ-2026-0001
                    asOf: '2026-10-01'
                    decision: APPROVE
                    stpEligible: true
                    results:
                      - code: MFI_FOIR_CAP
                        status: PASS
                      - code: MFI_MIN_AGE
                        status: PASS
                declined:
                  value:
                    decisionId: 01a11b0b-c1a2-7f10-9c22-81aa1b2c3d4e
                    tenantId: t_acme
                    requestId: REQ-2026-0004
                    asOf: '2026-10-01'
                    decision: DECLINE
                    stpEligible: false
                    results:
                      - code: MFI_FOIR_CAP
                        status: FAIL
                        reasonCode: POL_FOIR_EXCEEDED
                divisionByZero:
                  summary: An unguarded division — ERROR on the result, decision REFER
                  value:
                    decisionId: 01a11b0b-aa31-7001-b4d1-77ffee112233
                    tenantId: t_acme
                    requestId: REQ-2026-0005
                    asOf: '2026-10-01'
                    decision: REFER
                    stpEligible: false
                    results:
                      - code: MFI_FOIR_CAP
                        status: ERROR
                        error: EVAL_DIV_ZERO
        '400':
          description: The request body is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://bre.dev/problems/invalid-request
                title: Invalid request
                status: 400
                detail: tenantId must not be blank
        '422':
          description: |
            A BEL expression in the policy does not parse. The `line` and `column` locate it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BelProblem'
              example:
                type: https://bre.dev/problems/invalid-expression
                title: Invalid BEL expression
                status: 422
                detail: "expected end of expression but found '<' (at 1:7)"
                line: 1
                column: 7

  /v1/decisions/{decisionId}:
    get:
      tags: [Decisions]
      operationId: findDecision
      summary: Read a recorded decision
      description: |
        **Tenant-scoped.** A correct `decisionId` under the wrong tenant is a `404`, not a `403` —
        a decision is never readable across tenants (decision D1), and 404 is also the answer that
        leaks least, since a 403 would confirm the id exists.
      parameters:
        - name: decisionId
          in: path
          required: true
          description: The decision's identifier, a UUIDv7
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: true
          description: |
            The tenant to read within. Provisional: §6.2 derives the tenant from the authenticated
            principal, which is the only trustworthy source. A header is accepted today because
            there is no authentication yet — **do not expose this endpoint to an untrusted network
            in its current form**, because a caller can read another tenant's decision by changing
            one header.
          schema:
            type: string
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '404':
          description: No such decision for that tenant.

components:
  schemas:
    DecisionRequest:
      type: object
      required: [tenantId, requestId, facts, policy]
      properties:
        tenantId:
          type: string
          minLength: 1
          description: |
            The tenant. Multi-tenant from day one (D1): the tenant appears on every row, cache key,
            event, metric and log line, so it is required and never defaulted.
          examples: [t_acme]
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Your idempotency key. Retrying with the same key returns the original decision.
          examples: [REQ-2026-0001]
        asOf:
          type: string
          format: date
          description: |
            The date the policy is evaluated against. **Optional, and the default is worth
            understanding:** when absent, the service resolves it once from the tenant time zone
            (`Asia/Kolkata`) and stores the resolved value on the decision record.

            The engine itself never reads a clock (D8) — it only ever sees this date. That is what
            makes a replay exact: the stored `asOf` is replayed, not re-derived from today.
          examples: ['2026-10-01']
        facts:
          type: object
          additionalProperties: true
          description: |
            The fact snapshot. Facts in, decision out: the engine fetches nothing.

            **Decimals should be sent as JSON strings** (`"20000"`, `"0.45"`). A decimal that goes
            through a JSON number may be read as a double somewhere in the chain, and a double is
            how `0.1 + 0.2` stops equalling `0.3`. Exponent notation is rejected.

            **An absent field is a missing fact, which is not the same as zero.** A policy that
            needs it reports `DATA_MISSING` and the decision refers. Sending `0` for an unknown
            income says the borrower earns nothing, which is a different and much worse claim.
          examples:
            - application:
                applicationRef: APP-2026-000123
              member:
                income: '20000'
                emi: '5000'
                age: 34
        policy:
          $ref: '#/components/schemas/Policy'

    Policy:
      type: object
      required: [rules]
      description: |
        The rules to evaluate.

        **Development-mode only.** In a real deployment the registry resolves a signed,
        content-addressed bundle and a caller cannot choose the policy that decides its
        application (D4, D5). Accepting it inline is what makes the API testable before the
        registry exists.
      properties:
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Rule'

    Rule:
      type: object
      required: [code, check]
      properties:
        code:
          type: string
          minLength: 1
          description: The rule's identifier. The IR calls this `code`, never `id`.
          examples: [MFI_FOIR_CAP]
        check:
          type: string
          minLength: 1
          description: |
            A BEL expression that must be TRUE for the rule to pass.

            BEL is typed, decimal-native and sandboxed: no host calls, no arbitrary code, a closed
            function registry. `and` and `or` short-circuit, so `income > 0 and emi / income <= 0.5`
            never divides by zero.
          examples: ['member.emi / member.income <= 0.5']
        when:
          type: string
          description: |
            An optional guard. When it is **FALSE** the rule is `NOT_APPLICABLE`.

            When it is **unknown** — because a fact it reads is absent — the rule goes to
            `onMissing`, never to `NOT_APPLICABLE`. "We do not know whether this rule applies" is
            not the same as "it does not apply", and treating it as such is a fail-open.
          examples: ['member.mfiCycleNumber >= 2']
        onMissing:
          type: string
          enum: [DATA_MISSING, FAIL, NOT_APPLICABLE]
          default: DATA_MISSING
          description: |
            What to do when the check cannot be evaluated for want of a fact.

            `DATA_MISSING` (the default) refers the application. `NOT_APPLICABLE` makes the rule
            disappear, which is a deliberate author choice and a possible fail-open — use it only
            when a missing fact genuinely means the rule does not apply.
        reasonCode:
          type: string
          description: The reason attached to the outcome when the rule does not pass.
          examples: [POL_FOIR_EXCEEDED]

    DecisionResponse:
      type: object
      required: [decisionId, tenantId, requestId, decision, stpEligible, results]
      properties:
        decisionId:
          type: string
          format: uuid
          description: |
            A UUIDv7, so the identifier carries its own creation time. The hot store derives the
            row's partition date from it, which is why a lookup by id reads one partition rather
            than scanning every day the store holds.
        tenantId:
          type: string
        requestId:
          type: string
        asOf:
          type: string
          format: date
          description: The resolved evaluation date, as stored. Replay this, not today.
        decision:
          type: string
          enum: [APPROVE, APPROVE_WITH_DEVIATION, REFER, DECLINE]
          description: |
            Precedence, in order (LLD §4.8):

            - any `FAIL` → **DECLINE**
            - else any `ERROR`, `DATA_MISSING` or `REFER` → **REFER**
            - else any `DEVIATION` → **APPROVE_WITH_DEVIATION**
            - else → **APPROVE**

            Note that `FAIL` outranks `ERROR`: a policy breach is a more definite answer than an
            engine fault. Nothing uncertain can reach `APPROVE`.
        stpEligible:
          type: boolean
          description: |
            Whether this could go straight through with no human involvement.

            False the moment anything deviates — including a deviation an approver has already
            signed off. The decision is then `APPROVE`, but it was not straight-through, and the
            two facts are worth keeping apart.
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleOutcome'

    RuleOutcome:
      type: object
      required: [code, status]
      properties:
        code:
          type: string
        status:
          type: string
          enum: [PASS, DEVIATION, REFER, FAIL, NOT_APPLICABLE, DATA_MISSING, ERROR]
          description: |
            | Status | Means |
            |---|---|
            | `PASS` | the check was TRUE |
            | `FAIL` | the check was FALSE |
            | `DEVIATION` | failed within a tolerance an authority may approve |
            | `DATA_MISSING` | a fact the rule needed was absent |
            | `NOT_APPLICABLE` | the rule's `when` was FALSE |
            | `ERROR` | the rule could not be evaluated |
            | `REFER` | the rule asks for human review |
        reasonCode:
          type: string
          description: Present when the rule did not pass and declared one.
        error:
          type: string
          enum:
            - EVAL_DIV_ZERO
            - EVAL_OVERFLOW
            - EVAL_FUEL_EXHAUSTED
            - EVAL_LIST_TOO_LARGE
            - EVAL_TEXT_TOO_LONG
            - EVAL_TABLE_NO_MATCH
            - EVAL_TABLE_UNIQUE_VIOLATION
            - EVAL_SCORECARD_NO_BIN
            - EVAL_PARAM_NOT_EFFECTIVE
            - EVAL_REFERENCE_ERROR
            - EVAL_INTERNAL
          description: |
            The runtime error, present when `status` is `ERROR`. Reported on the result rather than
            as an HTTP error, because the engine still produced a decision (`REFER`).

            `EVAL_DIV_ZERO` is the one integrators hit most: division by zero is an **error**, not
            a missing value, so guard it with `income > 0 and …`.

    Problem:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: |
            Names the offending field, never its value. A validation message that quoted the
            submitted facts would put personal data into client logs and error trackers, where the
            engine no longer controls who reads it.

    BelProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            line:
              type: integer
              description: One-based line of the syntax error.
            column:
              type: integer
              description: One-based column.
