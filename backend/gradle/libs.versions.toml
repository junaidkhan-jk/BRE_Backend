# Single source of dependency versions (Build Plan §4).
# Everything resolves from Maven Central. Versions verified against
# repo1.maven.org on 2026-10-08; stable releases only, no milestones.

[versions]
# --- engine path. Nothing else may appear in bre-engine-core (LLD §1.2). ---
re2j = "1.8"

# --- libs outside the engine ---
jackson = "2.22.3"
snakeyaml-engine = "3.2"
# 1.5.x is the last line built against Jackson 2. json-schema-validator 3.x moved to Jackson 3
# (tools.jackson.databind), and this module — like every lib here — is on Jackson 2, so 3.x would
# mean two Jacksons in one module for one validator. Revisit when the libs move to Jackson 3.
json-schema-validator = "1.5.6"
zstd-jni = "1.5.7-22"

# JMH, for the engine latency budgets (M1-16) and to measure whether M1-05's closure lowering
# actually buys anything. A performance refactor with no benchmark is a guess with a diff.
jmh = "1.37"

# --- test ---
# JUnit stays on the 5.x line: jqwik 1.x and archunit-junit5 1.x both target
# the JUnit Platform 1.x API, which JUnit 6 replaces. Revisit together.
junit = "5.14.4"
assertj = "3.27.7"
jqwik = "1.10.1"
archunit = "1.5.1"
# Coverage-guided fuzzing of the BEL lexer and parser (M1-02's exit criterion).
jazzer = "0.30.0"

# OpenTelemetry API only — never the SDK in a library. A library that configured tracing would
# decide the exporter for every application embedding it; the API is the no-op interface until an
# application installs an SDK.
opentelemetry = "1.66.0"

# --- services (M2 onwards) ---
spring-boot = "4.1.1"
# JWT verification for a real identity provider (M3-09). The LIBRARY, not Spring Security's
# resource-server starter: that starter installs its own filter chain, and this service
# deliberately checks authorisation explicitly at every endpoint rather than declaratively (see
# Authorisation.java) — two mechanisms deciding who may call what is a defect waiting to happen.
# nimbus-jose-jwt is what Spring Security itself uses underneath, so the crypto, the JWKS fetch
# and the claim validation are all the library's and none of them is hand-rolled here.
nimbus-jose-jwt = "10.10"

# Generates the control-plane OpenAPI document FROM the Spring mappings (M6-05). Generated rather
# than hand-written for 43 endpoints, because a hand-written contract for an API under active
# development is a document that is wrong and does not say so — and an integrator reading it
# believes it. The 3.x line is the Spring Boot 4 / Jackson 3 one.
springdoc = "3.1.1"

# The WORM decision archive (M4-03), written as Parquet by DuckDB.
#
# NOT parquet-avro, and the reason is worth recording. Parquet 1.18 claims to have dropped Hadoop,
# and its READER has; its WRITER has not — ParquetWriter.Builder.build() constructs a
# HadoopParquetConfiguration, then reaches Hadoop's zlib enums, then Hadoop's XML parser. Taking
# hadoop-common properly costs 103 transitive artifacts: Jetty, Kerberos, Zookeeper, Curator and a
# long tail. That is a patch obligation and an attack surface, in the service that decides credit,
# for a file format.
#
# DuckDB is ONE artifact with ZERO transitives, writes standard Parquet that Spark, Athena, pandas
# and Polars all read, and gives SQL over the archive — which is exactly what a portfolio back-test
# over it needs. The cost is a native library in the service; it is confined to the archive writer,
# which is off the decision path and belongs to the sink the specification already separates out.
duckdb = "1.5.6.0"
postgresql = "42.7.9"
flyway = "13.10.0"
# Real PostgreSQL binaries for integration tests. The dev host has no Docker, so Testcontainers
# is not an option locally; this downloads and runs an actual postgres.
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "18.6.0"

[libraries]
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }

jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# java.time support. NOT optional, and not a convenience: a DecisionResponse carries a LocalDate
# asOf, so without this module every write to the POSTGRES decision log throws while serialising
# the results JSON. Found by the first test that wrote a decision to a real database — the
# IN_MEMORY log stores the object and never serialises it, so nothing had exercised the path.
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embedded-postgres-binaries" }

opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
