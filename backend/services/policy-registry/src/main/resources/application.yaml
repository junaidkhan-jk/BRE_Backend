spring:
  application:
    name: policy-registry
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

  # ---------------------------------------------------------------------------
  # DATABASE — PLACEHOLDER VALUES. Change these to your own PostgreSQL.
  # ---------------------------------------------------------------------------
  # Unlike the decision service, this one has NO in-memory mode. A registry
  # whose policy versions are not durable is not a registry: the whole point is
  # that an approval, a signature and a deployment are facts somebody can be
  # held to years later. It therefore refuses to start without a database.
  #
  # Prefer environment variables over editing this file, so no credential is
  # ever committed:
  #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  datasource:
    url: jdbc:postgresql://localhost:5432/bre        # CHANGE ME
    username: bre_ctl_app                            # CHANGE ME
    password: change-me                               # CHANGE ME — do not commit a real one
    hikari:
      maximum-pool-size: 8
      pool-name: bre-ctl

  # Flyway owns bre_ctl (LLD §5.2).
  flyway:
    enabled: true
    locations: classpath:db/migration
    # NO `schemas:` setting, deliberately. Flyway creates the schemas it is told about, and V1 does
    # `CREATE SCHEMA bre_ctl AUTHORIZATION bre_ctl_owner` itself — so naming it here makes Flyway
    # create it first (owned by the connecting user) and V1 then fails with "schema already
    # exists". Worse, the obvious fix of making V1 use IF NOT EXISTS would leave the schema owned
    # by the wrong role, which quietly breaks FORCE ROW LEVEL SECURITY and the §5.2 grants.
    #
    # So the migration owns the schema and its ownership, and Flyway's own history table lives in
    # `public`. Found by running these migrations through Spring Boot for the first time: the test
    # that had been executing them configured Flyway by hand, with no schemas setting, so this path
    # had never run.
    # Never clean the control plane. `flyway clean` here destroys every policy
    # version, every approval and the hash-chained audit log, and there is no
    # undo for an audit log.
    clean-disabled: true

server:
  port: 8081

bre:
  engine-version: 0.1.0-SNAPSHOT

  # Identifies this instance on a deployment it has claimed for activation. In a
  # cluster set it to the pod name; two instances sharing an id still activate
  # correctly — the claim is a database row lock, not this string — but the audit
  # entry then cannot say which one did it.
  instance-id: local

  deployment:
    # How often to look for a SCHEDULED deployment whose effective date has
    # arrived (00 §3.4). A lender schedules changes to the start of a business
    # day, so thirty seconds is already far finer than the requirement.
    activation-poll-ms: 30000

  # The identity provider (M3-09). OFF by default: with no issuer configured,
  # sign-in uses the local account table, which is what devstack does and what
  # the tests run against.
  #
  # The token establishes WHO; this installation still decides WHAT. Tenancy and
  # roles come from the users and role_assignments tables keyed on the IdP's
  # subject — never from a claim. Reading roles from a token would let whoever
  # administers the directory grant DEPLOY_APPROVE on a lender's credit policy,
  # without appearing in this system's audit trail and without the lender's own
  # administrators being part of a decision 00 §3.3 says needs two of them.
  #
  # So an IdP user must be provisioned here before they can act. A valid token
  # for an unknown subject is a 401, and the log says why.
  oidc:
    # CHANGE ME to your provider's issuer, e.g.
    # https://login.microsoftonline.com/<tenant>/v2.0 or
    # https://keycloak.yourbank.internal/realms/bre. Blank keeps OIDC off.
    issuer-uri: ""

    # Optional. Defaults to <issuer>/.well-known/jwks.json. Set it when your
    # provider publishes keys elsewhere — Microsoft Entra and Keycloak both do.
    # Deliberately NOT discovered from /.well-known/openid-configuration: that
    # is a second network dependency at startup for one string an operator
    # already knows, and a discovery document fetched over a compromised
    # connection chooses the signing keys.
    jwks-uri: ""

    # CHANGE ME. The audience this service accepts — your client or API
    # identifier. Blank accepts any audience, which means a token minted for a
    # DIFFERENT service by the same provider is accepted here. Set it.
    audience: ""

  # bre.studio.audit.v1 — publishing the governance trail to a SIEM or a
  # group-level audit system (M3-10, FR-AUD-005).
  #
  # OFF by default, and that is deliberate: an installation that has not named a
  # consumer has none, and inventing one would send a lender's governance trail
  # somewhere nobody chose. The trail is queryable at /v1/audit either way, and
  # pullable at /v1/audit/events for a consumer that cannot accept a push.
  studio-audit:
    # CHANGE ME to the consumer's collector URL to turn publishing on. Blank
    # publishes nothing.
    endpoint: ""

    # CHANGE ME. An Authorization header value for the consumer — and this is a
    # SECRET: supply it as BRE_STUDIO_AUDIT_AUTHORIZATION in the environment, or
    # from a mounted secret. It must not be committed.
    authorization: ""

    # Five seconds. A SIEM alerting on a policy approval is not a real-time
    # system, and the poll is one indexed query per pass.
    poll-ms: 5000
    timeout-ms: 5000

  registry:
    # The cell this registry publishes manifests for (§8.1). A manifest is per
    # cell and monotonically versioned, so two registries writing to one cell
    # would produce two version-1 manifests and pods would adopt whichever
    # arrived first.
    cell-id: 1

    # Where published manifests are written for the decision pods to read. In
    # production this is the §8.2 long-poll endpoint plus object storage; this
    # directory is the local equivalent and is what devstack points pods at.
    manifest-dir: ./var/manifests

    # Where built bundles are written. Content-addressed, so a file name is the
    # bundle hash and a wrong file cannot masquerade as the right one.
    bundle-dir: ./var/bundles

    # ---------------------------------------------------------------------------
    # SIGNING KEYS — LOCAL DEVELOPMENT ONLY.
    # ---------------------------------------------------------------------------
    # A production signing key is generated in, and never leaves, the KMS or HSM
    # (§8.6); this service calls the KMS to sign and never holds the key. These
    # two settings exist so the registry runs on a laptop. If either is set in a
    # deployed environment, that is the finding.
    #
    # Generate a pair with:  bre keygen bundle.pkcs8 bundle.x509
    bundle-signing-key: ""                            # base64 PKCS#8 Ed25519 — LOCAL ONLY
    bundle-signing-kid: "reg-local-2026-01"
    manifest-signing-key: ""                          # base64 PKCS#8 Ed25519 — LOCAL ONLY
    manifest-signing-kid: "manifest-cell1-2026-01"

    # ---------------------------------------------------------------------------
    # TRUSTED EXPORTERS — whose approvals this installation accepts (§8.6).
    # ---------------------------------------------------------------------------
    # Importing a signed bundle means accepting that ANOTHER installation's
    # review is binding here: the version arrives APPROVED and nobody in this
    # installation has read its contents. So the default is empty, and an
    # installation that has named nobody imports from nobody.
    #
    # kid -> base64 X.509 Ed25519 PUBLIC key. Public keys only; there is never a
    # reason for a private key to appear here.
    #
    #   trusted-exporters: "{'reg-uat-2026-01': 'MCowBQYDK2Vw...'}"
    trusted-exporters: "{:}"

    # ---------------------------------------------------------------------------
    # SANDBOX TENANT — LOCAL AND INTEGRATION ENVIRONMENTS ONLY (M6-05).
    # ---------------------------------------------------------------------------
    # Seeds a tenant called `sandbox` with five accounts, each holding exactly
    # one role, all sharing one password, so an integrator can walk the whole
    # maker-checker flow without creating accounts by hand. Segregation of
    # duties is NOT overridable in that tenant, so the sandbox behaves the way
    # production does.
    #
    # Leave this false in production. Five accounts with a published password is
    # the finding an audit opens with.
    sandbox-enabled: false
    sandbox-password: ""                              # blank generates one and logs it once

logging:
  level:
    dev.bre: INFO
