spring:
  application:
    name: decision-service
  threads:
    virtual:
      enabled: true          # ADR-012: evaluation is short and CPU-bound; the decision-log write
                             # is the only blocking hop, so thread-per-request on virtual threads
                             # meets the latency budget without an async programming model.
  jackson:
    default-property-inclusion: non_null

  # ---------------------------------------------------------------------------
  # KAFKA — PLACEHOLDER. Only read when bre.decision-log.mode=KAFKA.
  # ---------------------------------------------------------------------------
  # CHANGE ME to your brokers. Prefer SPRING_KAFKA_BOOTSTRAP_SERVERS in the
  # environment over editing this file.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # THESE THREE CARRY THE DURABILITY GUARANTEE. They are not tuning.
      #
      # acks=all          the leader waits for every in-sync replica. With acks=1,
      #                   a decision acknowledged to a caller is LOST when the
      #                   leader fails before replicating — which is exactly the
      #                   RPO-0 claim D6 makes.
      # idempotence       the producer stamps a sequence number, so a retry after
      #                   a network timeout does not append the decision twice.
      # retries           with idempotence on, a retry is safe, so retry hard
      #                   rather than failing a decision on a transient blip.
      #
      # The fourth setting is NOT here because it belongs on the TOPIC:
      # min.insync.replicas=2. Without it, acks=all on a single-replica topic is
      # acks=1 wearing a disguise. Set it when you create the topic.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Read the whole topic when a group is new. A sink that started at the end
      # would leave every decision made before it first ran absent from the hot
      # store, and nothing would ever say so.
      auto-offset-reset: earliest
      # The sink is idempotent on the decision id, so at-least-once is the right
      # trade: a duplicate is refused by the primary key, a LOST record is not
      # recoverable.
      enable-auto-commit: false

  # ---------------------------------------------------------------------------
  # DATABASE — PLACEHOLDER VALUES. Change these to your own PostgreSQL.
  # ---------------------------------------------------------------------------
  # Only read when bre.decision-log.mode=POSTGRES (see below). With the default
  # IN_MEMORY mode the service starts with no database at all, so these can be
  # left as they are until you want durability.
  #
  # Prefer environment variables over editing this file, so no credential is
  # ever committed:
  #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  datasource:
    url: jdbc:postgresql://localhost:5432/bre        # CHANGE ME
    username: bre_dec_app                            # CHANGE ME
    password: change-me                               # CHANGE ME — do not commit a real one
    hikari:
      maximum-pool-size: 16
      # The decision log write is on the hot path, so a connection that is not
      # available quickly should fail the request rather than queue behind others
      # and spend the caller's whole latency budget waiting.
      connection-timeout: 2000
      pool-name: bre-dec

  # Flyway owns the bre_dec schema (LLD §5.3). Disabled by default so the service
  # does not try to migrate a database that is not there.
  flyway:
    enabled: false                                    # set true with mode=POSTGRES
    schemas: bre_dec
    default-schema: bre_dec
    locations: classpath:db/migration
    # Never clean a decision store. An accidental `flyway clean` against the hot
    # store destroys the lender's audit trail, and there is no undo.
    clean-disabled: true

  # The service creates its own DataSource only when it needs one.
  autoconfigure:
    exclude: []

server:
  port: 8080

bre:
  # The engine version pinned into every decision record (D8), so a replay knows
  # which engine produced the original answer.
  engine-version: 0.1.0-SNAPSHOT

  # Recorded on every decision row. Use DEV / UAT / PERF / PROD in real
  # environments; a decision that cannot say which environment made it is not
  # much use in an audit.
  env-code: LOCAL

  # The WORM Parquet archive (§6.1.5, M4-03). OFF by default: the hot store's
  # retention is enough for an installation whose requirement it meets, and the
  # archive is what you turn on when it is not.
  #
  # CHANGE ME to a path on write-once storage with a retention lock. A plain
  # directory gives the same refusal-to-overwrite the real store does, and NOT
  # the retention lock — a process with write access can still delete a file,
  # which is exactly what WORM prevents.
  archive:
    dir: ""
    # §6.1.5: every five minutes or 256 MB. Expressed in rows here because the
    # row size is known and a byte estimate would be a worse way of saying it.
    roll-after-seconds: 300
    roll-at-rows: 20000

  decision-log:
    # IN_MEMORY  — local development. NOT DURABLE: every decision is lost on restart.
    # POSTGRES   — compact mode (D6). Durable: the decision, its idempotency key
    #              and its outbox event commit in ONE transaction before the
    #              response returns. This is what gives RPO 0 for an acknowledged
    #              decision. Requires spring.datasource.* and spring.flyway.enabled=true.
    # KAFKA      — Kafka-first (D6, M4-01). The response waits on the broker's
    #              acknowledgement. Needs spring.kafka.bootstrap-servers AND
    #              spring.datasource.*: the topic is the system of record, but a
    #              topic answers no questions, so every READ is served from the hot
    #              store the sink fills. A read can therefore lag a write.
    mode: IN_MEMORY

    kafka:
      topic: bre.decision.recorded.v1
      # The consumer group the sink joins. One group across every pod, so each
      # decision is written to the hot store once.
      sink-group: bre-decision-sink
      # How long a decision waits for the broker before the request fails. A 500
      # for a decision that was made correctly is bad; a 200 for a decision nobody
      # recorded is worse, and it is found by a regulator rather than a caller.
      ack-timeout-ms: 5000

    # Persist the fact snapshot, which replay needs (D7).
    #
    # OFF BY DEFAULT, AND THE DEFAULT IS THE SAFE ONE. Facts are the applicant's
    # personal data. §9.2 requires them stored as two envelopes under a tenant
    # data key and a per-principal key, so that erasure is performed by destroying
    # a key (§9.5) rather than by hunting rows. That key hierarchy is not built
    # yet, so turning this on writes PLAINTEXT personal data to
    # bre_dec.decision_facts.
    #
    # Turn it on for local replay work. Do not turn it on anywhere holding real
    # applicants until the §9.2 envelopes exist.
    store-facts: false


# --- Policy distribution (LLD §8.1, §8.3, §8.6) -------------------------------------------------
#
# The policy is RESOLVED, never supplied on the request. A caller names a policy code and may pin a
# bundle hash; this pod fetches that bundle by content address, verifies its signature against the
# keys below, and only then evaluates it.
#
# ONLY PUBLIC KEYS BELONG HERE. A decision pod verifies and never signs — the bundle and manifest
# signing keys live in the registry's KMS (§8.6), so a compromised pod can refuse policies but
# cannot mint one.
  policy:
    # Where verified bundles are cached on disk, and where the Active Pointer Manifest is read
    # from. In production both come from the registry (§8.2 long-poll); these are the local paths
    # a pod keeps them at.
    bundles: ./var/bundles
    manifest: ./var/manifest.json

    # CHANGE ME. The cell's manifest signing public key, base64-encoded X.509 Ed25519.
    # Generate the pair in the KMS; only the public half is ever deployed here.
    manifest-key: ""

    # CHANGE ME. This installation's bundle signing public keys, by key id. Hold BOTH the current
    # and the previous kid during a rotation — overlap is what stops a key change invalidating
    # every bundle signed an hour ago (§8.6).
    trusted-keys: {}
    #  reg-acme-prod-2026-01: "MCowBQYDK2VwAyEA..."
    #  reg-acme-prod-2025-07: "MCowBQYDK2VwAyEA..."

    # How long a retired champion stays pinnable (§8.1). Measured from when it stopped being
    # champion to the time a request ARRIVES — never to the caller's asOf, which the caller
    # supplies and could back-date.
    grandfather-window-days: 90


  # ---------------------------------------------------------------------------
  # DELIVERING DECISIONS TO ANOTHER SYSTEM (D6, LLD §7.6)
  # ---------------------------------------------------------------------------
  # Two ways out, both reading the same transactional outbox rows, so they can
  # never disagree about what was decided:
  #
  #   PUSH   this relay POSTs each decision to `endpoint` as a CloudEvent.
  #          Off when the endpoint is blank, which is the default: an
  #          installation that has not named a downstream has none, and
  #          inventing one would send a lender's credit decisions somewhere
  #          nobody chose.
  #
  #   FETCH  GET /v1/decision-events?since=<outboxId> — always available, needs
  #          no configuration, and reading does NOT consume. A warehouse can
  #          pull the same decisions the origination system is being pushed.
  #
  # Delivery is AT-LEAST-ONCE. A row is marked published after a successful
  # POST, so a crash between the two redelivers. Every event carries a stable
  # `ce_id` (the decision id) and your receiver must deduplicate on it — a
  # receiver that assumes exactly-once will eventually disburse twice.
  #
  # Requires a durable decision log: set bre.decision-log.mode=POSTGRES. In
  # IN_MEMORY mode there is no outbox, so there is nothing to deliver.
  outbox:
    endpoint: ""                                      # e.g. https://los.internal/bre/decisions
    authorization: ""                                 # e.g. "Bearer …" — prefer an env var
    poll-ms: 2000
    timeout-ms: 5000
    # After this many failed attempts an event is DEAD-LETTERED: never retried
    # automatically, visible in /v1/decision-events/health, replayed by an
    # operator once the cause is fixed. Silent infinite retry hides a
    # downstream outage; a dead-letter row does not.
    max-attempts: 12

logging:
  level:
    dev.bre: INFO

# ---------------------------------------------------------------------------
# OBSERVABILITY (M4-08, §11.5)
# ---------------------------------------------------------------------------
# Only health and prometheus are exposed, and that is deliberate rather than
# tidy. The actuator's other endpoints include env and configprops, which print
# configuration — and this service's configuration contains a KMS key and a
# decision-log password. An exposure list is the one place that is cheap to get
# wrong and expensive to discover.
#
# The scrape endpoint itself is NOT authenticated, like everything else here:
# this service belongs behind your gateway. See docs/EXTERNAL-CALLS.md.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never    # A health detail names a database host. Nobody scraping needs it.
  metrics:
    tags:
      # Every series carries which service and environment produced it, so one
      # Prometheus serving several cells can tell them apart.
      service: decision-service
