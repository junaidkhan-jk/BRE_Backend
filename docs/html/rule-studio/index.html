<body style="margin:0;height:100vh">
<div id="root" style="height:100%"></div>

<!--
  A CLASSIC script tag, not type="module", and that is deliberate.

  Browsers fetch ES modules under CORS, and a file:// URL has no origin — so a module script
  loaded by double-clicking this file is blocked and the page renders blank. The bundle is built
  as an IIFE (see ui/studio-web/vite.config.ts) precisely so this copy opens with no server.

  Vite's own dist/index.html still emits type="module"; that copy is for a real web server. This
  one is the offline review copy.
-->
<script src="assets/studio.js"></script>
</body>
</html>
